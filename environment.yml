# Conda environment for burned-area-s2.
#
# CPU-only by design: the protocol must run without a GPU (256 x 256 tiles at
# 20 m keep both training and inference tractable on CPU).
# Lower bounds rather than exact pins: the pipeline uses stable APIs only, and
# a floating solve is what actually keeps `conda env create` working on a clean
# machine months from now.
name: burned-area-s2
channels:
  - conda-forge
dependencies:
  - python=3.11

  # --- geospatial I/O ---
  - rasterio>=1.3
  - geopandas>=1.0
  - shapely>=2.0
  - pyproj>=3.6
  - rioxarray>=0.15
  - xarray>=2024.3

  # --- STAC access ---
  - pystac-client>=0.8
  - requests>=2.31

  # --- array / ML ---
  - numpy>=1.26
  - scipy>=1.11
  - scikit-learn>=1.4
  - pytorch-cpu>=2.2

  # --- config, viz, tooling ---
  - pyyaml>=6.0
  - matplotlib-base>=3.8
  - tqdm
  - pytest>=8.0
  - jupyterlab
  - ipykernel

  # No albumentations. Its pip chain needs an MSVC toolchain on Windows and its
  # conda build needs `simsimd`, which has no py311/win-64 package -- and the
  # only augmentation appropriate here is the D4 group (flips and 90-degree
  # rotations), which is a dozen lines of numpy. Photometric jitter would be
  # actively wrong: these are calibrated reflectances, not 8-bit RGB.

  - pip
  - pip:
      - segmentation-models-pytorch>=0.4
