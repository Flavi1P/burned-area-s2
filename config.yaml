# =============================================================================
# burned-area-s2 -- single source of truth.
#
# The experimental plan lives HERE, not in the scripts. No event name, EMS code,
# date or AOI appears anywhere else in the repository: every module and every
# script takes an event identifier and resolves it through this file.
#
# All EMS facts below were read on 2026-08-21 from the Copernicus EMS Rapid
# Mapping public API
#   https://rapidmapping.emergency.copernicus.eu/backend/dashboard-api/public-activations/?code=EMSRxxx
# and from the ISO 19115 lineage of each `observedEventA` layer inside the
# delineation package.
# =============================================================================

project:
  name: burned-area-s2

  # 20 m: native for B8A/B11/B12, and -- the decisive argument -- the EMS
  # delineations are digitised at 1:15 000 with a geometric RMSE of 8 m (see
  # each event's `label.production`). A per-pixel score at 10 m would mostly
  # measure the analyst's hand, not the method.
  target_resolution_m: 20
  target_crs: null            # null -> UTM zone of the Sentinel-2 tile
  tile_size_px: 256           # 5.12 km, 2621 ha, 65536 px per tile

  # 4 bands x 2 dates = 8 input channels. B02/B03 are dominated by residual
  # atmospheric signal and add no burn information at this dataset size.
  bands:                      # earth-search asset key -> Sentinel-2 band
    red: B04
    nir08: B8A
    swir16: B11
    swir22: B12
  qa_band: scl                # Scene Classification Layer, cloud/shadow masking

stac:
  endpoint: https://earth-search.aws.element84.com/v1
  collection: sentinel-2-l2a
  # Scene-level cloud cover is computed over the whole 110 km MGRS tile, so it
  # is a coarse pre-filter only -- deliberately loose, because a scene 70%
  # clouded over its tile can be perfectly clear over a 20 km footprint inside
  # it, and Saumos had exactly one candidate left when this sat at 40.
  cloud_cover_max: 85
  # The screen that actually decides. Cloud filters candidates, it never
  # ranks them: among the scenes clear enough over the footprint, the date
  # alone chooses. Fontainebleau is the case in point -- its 20%-scene-cloud
  # candidate is 45% clouded over the burn, its 0.4% candidate is clear.
  aoi_cloud_max: 0.15
  # Scene selection rule (section 4 of the design note): among the candidates in
  # the window, keep the acquisition closest to the date of the imagery the EMS
  # analyst actually delineated on. Label/image coherence beats radiometric
  # quality -- an incoherent pair is a systematic error that no metric recovers
  # from, whereas residual smoke is only noise.
  post_scene_rule: nearest_to_label_reference_date

ems:
  api: https://rapidmapping.emergency.copernicus.eu/backend/dashboard-api/public-activations/
  download_root: https://rapidmapping.emergency.copernicus.eu/backend
  observed_event_layer: observedEventA   # the burned perimeter
  aoi_layer: areaOfInterestA

paths:
  data_raw: data/raw          # downloaded COGs and EMS packages (git-ignored)
  data_interim: data/interim  # per-event stacks, label rasters (git-ignored)
  models: data/models         # trained weights, ~90 MB each (git-ignored)
  outputs: outputs            # figures and tables (versioned)

# -----------------------------------------------------------------------------
# events
#
# Three distinct Copernicus EMS activations. Biscarrosse is the size control:
# same biome as Saumos, same size class as Fontainebleau. Without it, a drop on
# Fontainebleau would confound "different biome" with "smaller fire", and those
# two conclusions carry very different weight.
# -----------------------------------------------------------------------------
events:

  - id: saumos
    name: Saumos
    admin: Gironde (33), Nouvelle-Aquitaine, France
    fuel: maritime pine plantation (Landes de Gascogne)
    role: train
    event_datetime: "2026-07-22T18:00:00"
    aoi_bbox: [-1.2674, 44.6183, -0.6852, 45.0095]   # EPSG:4326, EMS AOI01 "Le Porge"
    aoi_span_km: [43, 43]

    label:
      activation: EMSR899
      aoi: AOI01
      product: DEL_MONIT02        # latest delineation = full final extent
      version: 1
      status: final               # EMS statusCode "F", delivered 2026-07-30
      package_url: https://rapidmapping.emergency.copernicus.eu/backend/EMSR899/AOI01/DEL_MONIT02/EMSR899_AOI01_DEL_MONIT02_v1.zip
      # Date of the imagery the analyst delineated on. The post Sentinel-2 scene
      # is matched against THIS, not against the event date.
      reference_date: "2026-07-29"
      source_imagery: ["Legion VHR2 2026-07-29T14:07"]
      # Section 5: EMS production is not homogeneous, so the actual method is
      # recorded per event and reported. Filled by src/data/ems.py from the
      # ISO 19115 lineage of the observedEventA layer.
      production:
        # Read from the `det_method` attribute of the observedEventA polygons and
        # from the ISO 19115 lineage, by `python -m src.data.ems --event saumos`.
        method: "Semi-automatic extraction"
        delineated_on: "Legion 1.2 m, 2026-07-29"
        analysis_scale: "1:15000"
        mmu_m2: 225          # minimum mapping unit
        geometric_rmse_m: 2.4
      reported_burnt_area_ha: 31602.4   # EMS "Burnt area" statistic, this product
      # Alternative kept on record: DEL_MONIT01 v2 (2026-07-26) lists a
      # Sentinel-2 acquisition of 2026-07-26T10:56 among its own sources, so its
      # label/image coherence would be literal rather than approximate -- but it
      # misses ~21% of the final burn (24857 ha vs 31602 ha). Extent won.
      alternative_products:
        - {product: DEL_MONIT01, version: 2, reference_date: "2026-07-26", burnt_area_ha: 24857.4}
        - {product: DEL_PRODUCT, version: 1, reference_date: "2026-07-24", burnt_area_ha: 5775.4}

    imagery:
      pre_window: ["2026-06-15", "2026-07-20"]
      post_window: ["2026-07-27", "2026-08-10"]
      # T1.1. Resolved once by the rule above, then frozen here so the chain is
      # reproducible offline and the choice is auditable without a network call.
      # Both were re-checked against the full candidate list on 2026-08-22.
      #   pre : the three candidates closer to ignition (11, 13, 16 Jul) are
      #         48%, 54% and 73% clouded over the footprint. 06 Jul is the
      #         nearest clear one. A 16-day gap to ignition costs some
      #         phenological drift; a half-clouded pre-image costs the pixels.
      pre_date: "2026-07-06"
      #   post: +4 d from the label reference date, and the only alternative
      #         (10 Aug) is 75% clouded. Kept despite 27.3% cloud/shadow over
      #         the footprint -- the single worst validity figure in the
      #         project, carried into the results table rather than hidden:
      #         those pixels are dropped for BOTH methods identically.
      post_date: "2026-08-02"

    # Widely reported figure. NOT the evaluation reference -- it aggregates
    # several fronts and dates. The reference is the rasterised polygon.
    press_area_ha: 42000

  - id: biscarrosse
    name: Biscarrosse
    admin: Landes (40), Nouvelle-Aquitaine, France
    fuel: maritime pine plantation (Landes de Gascogne)
    role: test
    test_purpose: size control -- same biome as saumos, same size class as fontainebleau
    event_datetime: "2026-07-23T14:00:00"
    aoi_bbox: [-1.2091, 44.3444, -1.0416, 44.4788]
    aoi_span_km: [12, 15]

    label:
      activation: EMSR902
      aoi: AOI01
      product: DEL_MONIT01
      version: 2
      status: final               # EMS statusCode "F", delivered 2026-07-27
      package_url: https://rapidmapping.emergency.copernicus.eu/backend/EMSR902/AOI01/DEL_MONIT01/EMSR902_AOI01_DEL_MONIT01_v2.zip
      reference_date: "2026-07-26"
      source_imagery: ["Legion VHR2 2026-07-26T08:32", "Sentinel-2 2026-07-26T10:56"]
      production:
        # Read from the `det_method` attribute of the observedEventA polygons and
        # from the ISO 19115 lineage, by `python -m src.data.ems --event biscarrosse`.
        method: "Semi-automatic extraction"
        delineated_on: "Legion 2.0 m + Sentinel-2 10 m, 2026-07-26"
        analysis_scale: "1:15000"
        mmu_m2: 5625          # minimum mapping unit
        geometric_rmse_m: 20.0
      reported_burnt_area_ha: 1752.7
      alternative_products:
        - {product: DEL_PRODUCT, version: 1, reference_date: "2026-07-24", burnt_area_ha: 1018.6}

    imagery:
      pre_window: ["2026-06-15", "2026-07-21"]
      post_window: ["2026-07-24", "2026-08-05"]
      #   pre : -2 d from ignition, 0.0% cloud/shadow. Nothing to arbitrate.
      pre_date: "2026-07-21"
      #   post: the 26 Jul acquisition is literally one of the images the EMS
      #         analyst delineated on -- label/image coherence would be exact --
      #         but it is 48.6% clouded over the footprint. Coherence is worth
      #         a lot, not half the event. 02 Aug at 3.5% wins, +7 d.
      post_date: "2026-08-02"

    press_area_ha: 2200           # figure quoted in the EMS activation request

  - id: fontainebleau
    name: Fontainebleau
    admin: Seine-et-Marne (77), Ile-de-France, France
    fuel: mixed high forest, broadleaf-dominated
    role: test
    test_purpose: biome transfer -- broadleaf forest, unseen at training time
    event_datetime: "2026-07-12T15:00:00"
    aoi_bbox: [2.4715, 48.3513, 2.7013, 48.4251]
    aoi_span_km: [17, 8]

    label:
      activation: EMSR894
      aoi: AOI01
      product: DEL_MONIT01
      version: 1
      status: final               # EMS statusCode "F", delivered 2026-07-16
      package_url: https://rapidmapping.emergency.copernicus.eu/backend/EMSR894/AOI01/DEL_MONIT01/EMSR894_AOI01_DEL_MONIT01_v1.zip
      reference_date: "2026-07-16"
      source_imagery: ["GeoSat-2 VHR2 2026-07-16T07:57"]
      production:
        # Read from the `det_method` attribute of the observedEventA polygons and
        # from the ISO 19115 lineage, by `python -m src.data.ems --event fontainebleau`.
        method: "Semi-automatic extraction"
        delineated_on: "GeoSat-2 4.0 m, 2026-07-16"
        analysis_scale: "1:15000"
        mmu_m2: 576          # minimum mapping unit
        geometric_rmse_m: 8.0
      reported_burnt_area_ha: 831.9
      alternative_products:
        - {product: DEL_PRODUCT, version: 2, reference_date: "2026-07-14", burnt_area_ha: 769.3}

    imagery:
      pre_window: ["2026-06-01", "2026-07-11"]
      # EMS stopped delineating on 2026-07-16 while reignitions were reported
      # into late July. The label describes the 16 July extent, so the post
      # scene must stay close to it: a later scene would show burn the label
      # does not contain, and every such pixel would be scored a false positive.
      post_window: ["2026-07-16", "2026-07-24"]
      #   pre : -2 d from ignition, 0.0% cloud/shadow.
      pre_date: "2026-07-10"
      #   post: 18 Jul is nearer the label reference date (+2 d vs +4 d) but is
      #         45.1% clouded over the footprint; 20 Jul is at 0.0%. Both sit
      #         before the late-July reignitions, so neither shows burn the
      #         label does not contain.
      post_date: "2026-07-20"

    press_area_ha: null

# -----------------------------------------------------------------------------
# experiments -- the results table in the README is a direct translation of this
# block. Events are named by identifier only.
# -----------------------------------------------------------------------------
experiments:

  - id: E1
    question: In-domain reference ceiling.
    train: [saumos]
    test: [saumos]
    split: spatial_blocks         # disjoint held-out blocks inside saumos, buffered

  - id: E2
    question: >
      Transfer without recalibration. Comparing the two drops separates the size
      effect (biscarrosse) from the biome effect (fontainebleau).
    train: [saumos]
    test: [biscarrosse, fontainebleau]
    split: by_event

  - id: E3
    question: >
      How many annotations does opening a new territory cost? Fine-tune the E1
      weights on a spatially disjoint fraction of the target event.
    train: [saumos]
    finetune_on: fontainebleau
    finetune_fractions: [0.0, 0.10, 0.25]
    test: [fontainebleau]
    split: spatial_blocks
    # Fontainebleau fits in one or two spatial blocks, so a single partition
    # would leave a tiny, luck-dominated evaluation set. Repeat over alternating
    # disjoint partitions and publish mean + observed range, not a single line.
    n_partitions: 5

# -----------------------------------------------------------------------------
# evaluation protocol
# -----------------------------------------------------------------------------
evaluation:

  # Both methods output a continuous per-pixel score; the threshold is what
  # makes a mask. Calibrating one and leaving the other at an arbitrary default
  # compares an optimised operating point to an unoptimised one, with a bias of
  # unknown sign. Same procedure, same pixels, frozen before test, both sides.
  threshold:
    calibrated_on: saumos
    block_role: calibration       # blocks held out from both train and test
    objective: f1
    frozen: true
    recalibrate_on_target: false

    # A third threshold regime, added after E2 showed that the frozen threshold
    # is the dominant failure on an unseen biome: the dNBR oracle sits at 0.284
    # on fontainebleau against a frozen 0.576, so the index loses 80% of the
    # burn to a threshold that is nearly twice its own optimum there.
    #
    # `unsupervised` estimates a threshold from the shape of the score's own
    # histogram on the target event, using no labels. It is therefore
    # deployable, which the oracle is not, and it is applied to EVERY method or
    # to none -- the same symmetry rule that governs the frozen threshold.
    #
    # Both estimators are reported, not just the better one. Otsu was chosen
    # first and gmm added afterwards, so publishing only the winner would be a
    # selection on the test events by another name; see the provenance note in
    # outputs/regimes.md.
    unsupervised:
      estimators: [otsu, gmm]
      bins: 512               # histogram resolution for otsu
      clip_percentiles: [0.5, 99.5]   # trims the tails that would dominate the variance
      gmm_components: 2       # background mode + burned mode
      max_samples: 200000     # subsample the scene for the mixture fit; seeded

  # Not a competitor -- impossible in production, it requires already knowing
  # the truth. An instrument:
  #   CNN ~ oracle > honest  -> the gain is calibration transfer, not context
  #   CNN > oracle           -> the gain is information the index cannot hold
  dnbr_oracle: true

  # Circularity floor: how much of "U-Net > dNBR" is merely agreement with the
  # way the label itself was produced.
  report_dnbr_ems_agreement: true

  # Test footprint = EMS area of interest + this buffer, purely geometric.
  # Every tile inside it is evaluated, including entirely unburned ones.
  test_footprint_buffer_m: 2000

  metrics: [iou, f1, precision, recall, pr_curve, confusion_matrix, area_error_ha]
  # Never global accuracy: it sits near 98% and means nothing under this imbalance.
  forbidden_metrics: [accuracy]

  tiling:
    # A training tile must lie entirely inside pixels carrying one role -- see
    # the module docstring of src/data/tiles.py -- and must be at least half
    # usable after cloud masking. The Saumos post-fire scene is 27% clouded, and
    # a tile that is mostly NaN teaches the network to predict from padding.
    train: {overlap_px: 128, min_valid_fraction: 0.5}
    # Overlap between test tiles manufactures dependence between evaluation
    # units and invalidates the bootstrap. The test footprint is geometric
    # (AOI + buffer) and nothing in it is filtered out.
    test: {overlap_px: 0, filter_negatives: false}

  # No negative-tile sampling policy, and that is a measured decision rather
  # than an omission. The design note asked for ~2 negatives per positive with
  # clearcuts oversampled. On the ground this project actually has, the train
  # role of saumos yields 70 usable tiles at the overlap above, 34 of them
  # positive -- already ~1:1. Enforcing 2:1 could only be done by discarding
  # positives from a pool of 70. And no clearcut layer exists here; the only
  # way to build one in scope would be to threshold the dNBR, which is the
  # baseline under test and would make the training set circular.
  #
  # So the training pool is every train-role tile that fits, and its actual
  # composition is reported rather than engineered.

  spatial_blocks:
    # Beyond the autocorrelation range of a burn scar; the reasoning is in the
    # module docstring of src/eval/blocks.py.
    superblock_km: 17.5
    bootstrap_iterations: 1000
    # Below this: report the point estimate and write "interval not estimable --
    # N independent spatial blocks". A declared hole beats a false interval.
    #
    # Counted over blocks that CONTAIN BURNED PIXELS, not blocks. Every metric
    # here is a statement about burned area, so a block holding only background
    # is not a replicate of it. On the numbers this project actually has, that
    # reading costs the interval everywhere -- including on the training event,
    # whose four held-out blocks carry 94% of their burned area in one of them.
    # Declaring that is the point of the rule.
    min_blocks_for_interval: 4

    # Pixels within this distance of a block holding a different role belong to
    # no role at all, so a train pixel and a calibration or test pixel are
    # never closer than 2 km. The guarantee that no *tile* straddles a seam is
    # enforced separately, by requiring every training tile to lie entirely
    # inside train-role pixels -- which is stricter than any buffer and free.
    #
    # 2560 m (half a tile) was tried first and had to be abandoned: the Saumos
    # scar is ~18 km across and the 17 km block seams cut through its middle,
    # so a 2.5 km erosion on both sides of every seam removed 98% of the burned
    # area in the calibration blocks (1442 ha -> 30 ha) and left nothing to
    # calibrate a threshold on. 1000 m costs 10.7% of the footprint instead of
    # 26.1% and leaves 666 ha. The residual risk this accepts is fine-scale
    # correlation across a seam at 1-2 km, which is far below the range the
    # super-block exists to defend against.
    role_buffer_m: 1000

    # Roles inside the training event. Blocks are named r{row}c{col} from the
    # north-west corner of the event grid, so the map below is literally the
    # layout on the ground; src/eval/blocks.py derives the same ids from the
    # grid geometry alone. Saumos is 51.1 x 48.6 km, so it holds 3 x 3 blocks
    # of ~17 km; the two test events fit in one block each and are test in
    # full, which is why neither of them can carry a bootstrap interval.
    #
    # The partition was drawn by looking at the TRAINING event's own label, and
    # at nothing else -- no test event took part in it. Three constraints fixed
    # it, and they conflict, because the scar is not spread evenly over the AOI:
    # 87% of the burned pixels sit in the four north-west blocks.
    #   - every role must hold burned area, or a threshold calibrated on the
    #     calibration blocks would be calibrated on almost pure background;
    #   - the test role must hold at least `min_blocks_for_interval` blocks, or
    #     the in-domain reference row carries no interval either;
    #   - the scar's core stays in train, because the model has to learn from
    #     something.
    # Burned hectares surviving the cloud mask and the buffer in each role:
    # train 13 662, calibration 666, test 5 239, out of 31 592 ha rasterised.
    # The gap is the price of the Saumos post-fire scene, which is 27% clouded
    # and is still the best one available -- see the event's `post_date`.
    #
    # Declared and not worked around: burn prevalence is 24% in the train
    # blocks, 2.2% in the calibration blocks and 6.8% in the test blocks,
    # because the scar is a single blob rather than something spread evenly
    # over the AOI. An F1-optimal threshold depends on prevalence, so the
    # frozen threshold is not the optimum for the test blocks. That is the
    # point: the protocol guarantees the two methods share one procedure and
    # one set of pixels, not that either is at its own optimum.
    roles:
      saumos:
        calibration: [r0c0, r1c2]
        test: [r0c1, r0c2, r2c1, r2c2]
        # everything not named above is train

# -----------------------------------------------------------------------------
# pixel_model -- the control that was missing from the original design.
#
# dNBR is 2 bands and one threshold; the U-Net is 8 bands and a receptive field.
# Nothing in between, so "the network beats the index" confounds two causes:
# six extra bands, and spatial context. This block is the model that separates
# them -- every band the network sees, per pixel, with no context whatsoever.
# Whatever it recovers of the network's lead was never about context.
#
# Histogram gradient boosting from scikit-learn, which is already a dependency.
# CatBoost and LightGBM are the same algorithm family and would add a dependency
# to change the third decimal; if that ever matters the estimator swaps here.
# -----------------------------------------------------------------------------
pixel_model:
  estimator: sklearn.HistGradientBoostingClassifier
  max_iter: 400
  learning_rate: 0.06
  max_leaf_nodes: 31
  # NaN is routed natively by the histogram splitter, so an unusable pixel needs
  # no imputation and no dropping -- which is what keeps this method's evaluation
  # domain identical to the dNBR's, pixel for pixel.
  handles_nan: true
  # Training pixels come from the train-role blocks of the training event only.
  # Those are already disjoint from the calibration and test blocks and 1 km
  # buffered from them, so the pixel model inherits the U-Net's separation
  # guarantee without needing a tiling rule of its own.
  max_train_pixels: 1500000
  seed: 20260821

  # Two feature sets, and the comparison between them is the point.
  #
  # `full` is everything the U-Net sees, expressed per pixel. `change_only`
  # drops every absolute post-fire level and keeps differences and pre-fire
  # context, which is the tabular form of the question "does restricting the
  # model to change features make its threshold transfer?".
  features:
    full:
      - dnbr          # the baseline index itself
      - pre_nbr
      - post_nbr
      - dndvi
      - pre_ndvi
      - post_ndvi
      - dnbr2
      - post_nbr2
      - d_red
      - d_nir08
      - d_swir16
      - d_swir22
      - post_red
      - post_nir08
      - post_swir16
      - post_swir22
    change_only:
      - dnbr
      - dndvi
      - dnbr2
      - pre_nbr
      - pre_ndvi
      - d_red
      - d_nir08
      - d_swir16
      - d_swir22
  # The feature set whose rows carry the plain method name in the results table.
  # The other one is reported beside it as an ablation, never instead of it.
  reported: full


model:
  architecture: unet
  encoder: resnet34
  # On SWIR channels the contribution of pretrained first-layer RGB filters is
  # marginal. The real benefit is a regularising initialisation of the deep
  # layers, which matters here precisely because the training set is 65 tiles.
  encoder_weights: imagenet
  in_channels: 8
  classes: 1
  # BCE stabilises the start of training, when Dice gradients are poor because
  # nothing is predicted positive yet; Dice then carries the class imbalance.
  loss: {bce_weight: 1.0, dice_weight: 1.0}
  batch_size: 8
  epochs: 40
  lr: 0.0003
  weight_decay: 0.0001
  lr_schedule: cosine         # to zero over `epochs`; adds no tunable parameter
  seed: 20260821
  # No multi-seed spread: it measures optimiser variance, not the variance that
  # matters, and printing it next to a single-event metric fakes precision.

  # The D4 group -- flips and 90-degree rotations -- and nothing else. A burn
  # scar has no canonical orientation, so D4 is label-preserving by construction.
  # Photometric jitter would be actively wrong on calibrated reflectance, and
  # scaling would break the 20 m grid the whole protocol is defined on.
  augment: d4

  # Model selection runs on the calibration blocks, which are held out from both
  # train and test, and on average precision, which is threshold-free. Selecting
  # on a thresholded score would entangle the choice of epoch with the choice of
  # threshold; those are kept separate on purpose. The consequence to declare:
  # the calibration blocks do double duty, model selection and threshold, so the
  # F1 the threshold reports there is mildly optimistic. Neither use touches a
  # test pixel, which is the property that matters.
  select_on: average_precision
  # Windows spawns rather than forks, and 65 in-memory tiles do not need workers.
  num_workers: 0
